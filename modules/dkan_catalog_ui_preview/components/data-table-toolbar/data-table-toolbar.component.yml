$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Data table toolbar
status: experimental
description: File header (distribution chooser or file caption, format and column count, then the Download disclosure); tools row (Filters / Columns / View / Share view panels, details elements with a heading; Filters and Columns hold GET forms to the apply route, View is JS-only); status row (result summary and chips). Works without JavaScript.
props:
  type: object
  required:
    - apply_url
    - filters
    - columns
    - chips
    - share
    - labels
  properties:
    apply_url:
      type: string
      title: Apply route URL
    fragment_url:
      type: string
      title: Fragment route URL (empty disables in-place updates)
    show_panels:
      type: boolean
      title: Render the panels and chips
      default: true
    has_summary:
      type: boolean
      title: The summary slot has content (renders the status row)
      default: false
    caption:
      type:
        - object
        - 'null'
      title: File caption (the table's accessible name)
      properties:
        id:
          type: string
        text:
          type: string
    file_meta:
      type: array
      title: File header metadata
      description: Known parts only (format, exposed column count), joined with a middle dot.
      items:
        type: string
    open_panel:
      type: string
      title: Panel rendered open
      enum:
        - ''
        - filters
        - columns
        - display
        - share
    download:
      type:
        - object
        - 'null'
      title: Download choices
      description: NULL when neither choice exists. With only the original file the template renders a direct link.
      properties:
        original:
          type:
            - object
            - 'null'
          title: Original file (validated downloadURL)
          properties:
            url:
              type: string
            label:
              type: string
              description: Label inside the disclosure.
            button_label:
              type: string
              description: Label of the direct link when it is the only choice.
        results:
          type:
            - object
            - 'null'
          title: Current results export (all matching rows, selected columns, sort)
          properties:
            url:
              type: string
              description: Datastore download route; empty when nothing matches (rendered disabled).
            label:
              type: string
    chooser:
      type:
        - object
        - 'null'
      title: Distribution chooser
      properties:
        tables:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
              selected:
                type: boolean
    filters:
      type: object
      title: Filter panel
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
              category:
                type: string
        rows:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              property:
                type: string
              operator:
                type: string
              value:
                type: string
              operators:
                type: array
        blank_index:
          type: integer
        all_operators:
          type: array
        operator_sets:
          type: object
          description: Operator options per column category, for the script.
        hidden:
          type: object
        count:
          type: integer
        max:
          type: integer
        value_max_length:
          type: integer
    columns:
      type: object
      title: Columns panel
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              label:
                type: string
              visible:
                type: boolean
              can_move_up:
                type: boolean
              can_move_down:
                type: boolean
        hidden:
          type: object
        hidden_count:
          type: integer
        cancel_url:
          type: string
          description: Canonical URL of the current state (discards unsaved changes).
    chips:
      type: object
      title: Active filter and hidden-column chips
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              url:
                type: string
              remove_label:
                type: string
        label:
          type: string
          description: Accessible name of the chip list.
        clear_all_url:
          type: string
        clear_all_label:
          type: string
          description: Accessible name of Clear all (filters and column visibility).
    share:
      type: object
      title: Share panel
      properties:
        copy_url:
          type: string
          description: Absolute canonical URL of the current state.
    labels:
      type: object
      title: Panel labels
      properties:
        filters:
          type: string
        columns:
          type: string
        display:
          type: string
        share:
          type: string
        download:
          type: string
slots:
  summary:
    title: Result summary
