views.row.dkan_dataset_card:
  type: views_row
  label: 'DKAN dataset card'
  mapping:
    view_mode:
      type: string
      label: 'View mode'

views.area.dkan_catalog_ui_facets:
  type: views_area
  label: 'DKAN facet blocks'
  mapping:
    facets:
      type: string
      label: 'Facet ids, one per line'
    heading:
      type: label
      label: 'Heading'

plugin.plugin_configuration.facets_processor.dcu_case:
  type: mapping
  label: 'Re-case display values'
  mapping:
    mode:
      type: string
      label: 'Mode (ucwords or upper)'

dkan_catalog_ui.settings:
  type: config_object
  label: 'DKAN catalog UI settings'
  mapping:
    overview_properties:
      type: sequence
      label: 'Metadata properties in the Overview table, in order'
      sequence:
        type: string
        label: 'Property name'
    overview_other_properties:
      type: boolean
      label: 'Also show other dataset schema properties, in schema order'
